# charvoice configuration. See requirements.md for the full field reference.
#
# Paths below are relative to the project directory: the local checkout when
# running locally, or the mounted Google Drive folder once mount_drive() has
# been called in the notebook. Never hard-code an absolute path here.

project:
  name: character-voice-generator

tts:
  default_engine: f5-tts

  engines:
    dummy: {}

    f5-tts:
      model_dir: models/f5-tts
      # Quality tuning -- see src/charvoice/engines/f5_tts.py for what each
      # does. Changing any of these invalidates the segment cache for lines
      # using this engine, so a re-run actually regenerates rather than
      # silently serving back old cached audio.
      model: F5TTS_v1_Base
      nfe_step: 48          # flow-matching solver steps; main quality knob
      cfg_strength: 2.0
      sway_sampling_coef: -1.0
      cross_fade_duration: 0.15
      target_rms: 0.1
      remove_silence: true

    gpt-sovits:
      model_dir: models/gpt-sovits
      # Defaults target the v2 pretrained base model (few-shot cloning, no
      # training needed). Override to use a different version/checkpoint:
      # version: v2
      # t2s_weights: gsv-v2final-pretrained/s1bert25hz-5kh-longer-epoch=12-step=369668.ckpt
      # vits_weights: gsv-v2final-pretrained/s2G2333k.pth

audio:
  output_format: wav
  sample_rate: 48000
  channels: 1
  bit_depth: 16
  pause_between_lines_ms: 250
  pause_between_scenes_ms: 800
  # null skips per-segment peak normalization -- F5-TTS already manages its
  # own output level (target_rms above), so re-scaling each line on top of
  # that independently would make loudness jump line to line and amplify
  # noise in quiet segments. target_lufs below normalizes the whole
  # assembled file once instead, which is the right level to do it at.
  peak_dbfs: null
  target_lufs: -16.0

paths:
  voices: voices
  models: models
  scripts: scripts
  output: output
  temp: tmp
  cache: tmp/cache
